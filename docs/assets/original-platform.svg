<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 990" role="img" aria-labelledby="title desc">
  <title id="title">Original monocell platform loop</title>
  <desc id="desc">A compact, alternating two-column flow from cell evidence through ingest, analyses, model assembly, held-out validation, and a feedback loop for the next test.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1,1 L10,6 L1,11 Z" fill="#66817c" />
    </marker>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #173331; }
      .subtitle { font: 16px 'Segoe UI', Arial, sans-serif; fill: #526a66; }
      .label { font: 700 14px 'Segoe UI', Arial, sans-serif; letter-spacing: 1px; fill: #52706b; }
      .head { font: 700 19px 'Segoe UI', Arial, sans-serif; fill: #173331; }
      .body { font: 16px 'Segoe UI', Arial, sans-serif; fill: #405b57; }
      .small { font: 14px 'Segoe UI', Arial, sans-serif; fill: #526a66; }
      .node { stroke: #c4d3cf; stroke-width: 2; rx: 16; }
      .edge { fill: none; stroke: #66817c; stroke-width: 3; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #8caaa3; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1000" height="990" fill="#f6f9f7" />
  <text x="70" y="55" class="label">MONOCELL / ORIGINAL PLATFORM</text>
  <text x="70" y="98" class="title">From test evidence to a defensible cell model</text>
  <text x="70" y="130" class="subtitle">A system-level view; implementation and calibration details are intentionally omitted.</text>

  <rect x="70" y="170" width="410" height="160" fill="#e7f2ed" class="node" />
  <text x="98" y="206" class="label">01 / EVIDENCE</text>
  <text x="98" y="243" class="head">Cell and experiments</text>
  <text x="98" y="277" class="body">Lab exports, protocol facts, and the</text>
  <text x="98" y="303" class="body">cell's shared build record.</text>

  <rect x="520" y="170" width="410" height="160" fill="#e4eef2" class="node" />
  <text x="548" y="206" class="label">02 / INGEST AND STORE</text>
  <text x="548" y="243" class="head">One experiment contract</text>
  <text x="548" y="277" class="body">Normalize records and keep quality</text>
  <text x="548" y="303" class="body">findings beside the data.</text>
  <path d="M482,250 H508" class="edge" />

  <rect x="520" y="390" width="410" height="160" fill="#f3eddb" class="node" />
  <text x="548" y="426" class="label">03 / ANALYSIS</text>
  <text x="548" y="463" class="head">Test-specific evidence products</text>
  <text x="548" y="497" class="body">Versioned results record their inputs</text>
  <text x="548" y="523" class="body">and can be re-derived.</text>
  <path d="M725,332 V378" class="edge" />

  <rect x="70" y="390" width="410" height="160" fill="#e7f2ed" class="node" />
  <text x="98" y="426" class="label">04 / MODEL</text>
  <text x="98" y="463" class="head">Assemble a cell-specific model</text>
  <text x="98" y="497" class="body">Measured and stated inputs keep their</text>
  <text x="98" y="523" class="body">sources and coverage visible.</text>
  <path d="M518,470 H492" class="edge" />

  <rect x="70" y="610" width="410" height="160" fill="#f3e6e2" class="node" />
  <text x="98" y="646" class="label">05 / VALIDATE</text>
  <text x="98" y="683" class="head">Check against held-out evidence</text>
  <text x="98" y="717" class="body">Report the result, coverage, and</text>
  <text x="98" y="743" class="body">limits of what the model knows.</text>
  <path d="M275,552 V598" class="edge" />

  <rect x="520" y="610" width="410" height="160" fill="#dceee7" class="node" />
  <text x="548" y="646" class="label">06 / REFRESH AND PLAN</text>
  <text x="548" y="683" class="head">Re-derive and choose what is next</text>
  <text x="548" y="717" class="body">Changed inputs stale dependent results;</text>
  <text x="548" y="743" class="body">evidence gaps guide the next test.</text>
  <path d="M482,690 H508" class="edge" />

  <path d="M930,690 C970,690 970,146 485,146 H275 V160" class="loop" />
  <text x="962" y="440" transform="rotate(-90 962 440)" class="small">next test / refreshed evidence</text>
</svg>