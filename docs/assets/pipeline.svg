<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1160" role="img" aria-labelledby="title desc">
  <title id="title">How monocell moves from lab tests to a model run</title>
  <desc id="desc">A compact view of this copy: check and save lab files, pass them through the included parameter step, then run a discharge simulation. When tests change, affected results can be run again.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1,1 L10,6 L1,11 Z" fill="#66817c" />
    </marker>
    <marker id="loop-arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1,1 L10,6 L1,11 Z" fill="#a77922" />
    </marker>
    <style>
      .title { font: 700 31px 'Segoe UI', Arial, sans-serif; fill: #173331; }
      .subtitle { font: 17px 'Segoe UI', Arial, sans-serif; fill: #526a66; }
      .label { font: 700 14px 'Segoe UI', Arial, sans-serif; letter-spacing: 1px; fill: #52706b; }
      .head { font: 700 19px 'Segoe UI', Arial, sans-serif; fill: #173331; }
      .body { font: 16px 'Segoe UI', Arial, sans-serif; fill: #405b57; }
      .small { font: 14px 'Segoe UI', Arial, sans-serif; fill: #526a66; }
      .node { stroke: #c4d3cf; stroke-width: 2; rx: 16; }
      .edge { fill: none; stroke: #66817c; stroke-width: 3; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #a77922; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#loop-arrow); }
    </style>
  </defs>
  <rect width="1000" height="1160" fill="#f6f9f7" />
  <text x="70" y="58" class="label">MONOCELL / THIS COPY</text>
  <text x="70" y="101" class="title">From lab tests to a model run</text>
  <text x="70" y="133" class="subtitle">Follow the sample data through the parts included here.</text>

  <rect x="70" y="175" width="410" height="145" fill="#e7f2ed" class="node" />
  <text x="98" y="209" class="label">01 / LAB FILES</text>
  <text x="98" y="244" class="head">Test files and cell details</text>
  <text x="98" y="276" class="body">Files from lab equipment, test notes,</text>
  <text x="98" y="300" class="body">and details about the cell.</text>

  <rect x="520" y="175" width="410" height="145" fill="#e4eef2" class="node" />
  <text x="548" y="209" class="label">02 / LOOK FIRST</text>
  <text x="548" y="244" class="head">Preview the file before saving</text>
  <text x="548" y="276" class="body">See how it will be read and what kind</text>
  <text x="548" y="300" class="body">of test it appears to contain.</text>
  <path d="M482,247 H508" class="edge" />

  <rect x="520" y="380" width="410" height="145" fill="#e4eef2" class="node" />
  <text x="548" y="414" class="label">03 / MATCH FORMATS</text>
  <text x="548" y="449" class="head">Put different files in one format</text>
  <text x="548" y="481" class="body">Match column names, units, time, and</text>
  <text x="548" y="505" class="body">test steps; report fields that do not fit.</text>
  <path d="M725,322 V368" class="edge" />

  <rect x="70" y="380" width="410" height="145" fill="#f3eddb" class="node" />
  <text x="98" y="414" class="label">04 / CHECK THE DATA</text>
  <text x="98" y="449" class="head">Check required details and data quality</text>
  <text x="98" y="481" class="body">Files missing required details are refused.</text>
  <text x="98" y="505" class="body">Other concerns are saved as warnings.</text>
  <path d="M518,452 H492" class="edge" />

  <rect x="70" y="585" width="410" height="145" fill="#e7f2ed" class="node" />
  <text x="98" y="619" class="label">05 / SAVE EACH TEST</text>
  <text x="98" y="654" class="head">Keep the file and its saved data</text>
  <text x="98" y="686" class="body">Save the original read, shared-format data,</text>
  <text x="98" y="710" class="body">test notes, and check results.</text>
  <path d="M275,527 V573" class="edge" />

  <rect x="520" y="585" width="410" height="145" fill="#f3eddb" class="node" />
  <text x="548" y="619" class="label">06 / MODEL SETTINGS</text>
  <text x="548" y="654" class="head">Set the values used by the model</text>
  <text x="548" y="686" class="body">The original uses results from cell tests.</text>
  <text x="548" y="710" class="small">This copy uses published example values.</text>
  <path d="M482,657 H508" class="edge" />

  <rect x="520" y="790" width="410" height="145" fill="#e7f2ed" class="node" />
  <text x="548" y="824" class="label">07 / MODEL SETTINGS FILE</text>
  <text x="548" y="859" class="head">Save the values and where they came from</text>
  <text x="548" y="891" class="body">List the tests used to make this file.</text>
  <text x="548" y="915" class="small">Here, the values do not use sample tests.</text>
  <path d="M725,732 V778" class="edge" />

  <rect x="70" y="790" width="410" height="145" fill="#e4eef2" class="node" />
  <text x="98" y="824" class="label">08 / RUN THE MODEL</text>
  <text x="98" y="859" class="head">Run a discharge in PyBaMM</text>
  <text x="98" y="891" class="body">Save the result with a note of which</text>
  <text x="98" y="915" class="body">settings and tests it used.</text>
  <path d="M518,862 H492" class="edge" />

  <rect x="70" y="985" width="860" height="112" fill="#ffffff" class="node" />
  <text x="98" y="1022" class="label">WHEN TEST DATA CHANGES</text>
  <text x="98" y="1057" class="body">Mark the results that use it, so they can be run again.</text>
  <path d="M95,732 V973" class="loop" />
  <path d="M930,1040 H970 V655 H940" class="loop" />
</svg>