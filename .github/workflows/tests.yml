# The whole suite on every push, including the PyBaMM solves.

name: tests

on:
  push:
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install monocell with its test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: pytest
        run: pytest -n 4
