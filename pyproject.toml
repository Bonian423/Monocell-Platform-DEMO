[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monocell"
version = "0.2.0"
description = "Battery test data from instrument exports to a PyBaMM model (parameter extraction abstracted in this copy)"
readme = "README.md"
requires-python = ">=3.11"
# `openpyxl` because the EIS reader accepts XLSX workbooks. `pybamm` is imported
# only by `monocell.simulate`, inside its functions, so ingest and queries never
# load it.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "duckdb>=0.9",
    "openpyxl>=3.1",
    "pybamm>=26.8,<27",
]

[project.optional-dependencies]
test = ["pytest>=9", "pytest-xdist>=3.8", "pytest-timeout>=2.4"]
notebook = ["jupyter", "matplotlib>=3.8"]

[project.scripts]
monocell = "monocell.cli:main"

[tool.setuptools.packages.find]
include = ["monocell*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` marks the tests that run a PyBaMM solve. The default run includes
# them; `-m "not slow"` is the quick inner loop.
markers = [
    "slow: runs a PyBaMM solve",
]
addopts = "-q --durations=10"
# A hang-catcher, not a performance gate: a solver or a subprocess can wedge
# without failing, and a test that trips this is stuck, not slow.
timeout = 600
